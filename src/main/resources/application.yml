spring:
  profiles:
    # 활성 프로파일은 환경변수 SPRING_PROFILES_ACTIVE로 결정한다.
    # - 운영(EC2): docker-compose가 SPRING_PROFILES_ACTIVE=prod 주입 → prod
    # - CI 테스트: test 프로파일 지정
    # - 로컬 개발: 환경변수 미설정 시 아래 기본값(local)이 적용된다.
    #   ※ 기본값을 비우지 않는 이유: 비우면 로컬에서 base 설정의 ${DB_URL} 등이
    #     .env(운영 Supabase)로 해석되어 로컬 실행이 운영 DB에 붙는 사고가 난다.
    #     local 프로파일이 로컬 DB/메일로 오버라이드하므로 안전한 기본값으로 유지한다.
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


logging:
  level:
    root: WARN
    com.whatsuphouse: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 604800000
  chat-socket-expiration: 120000 # 채팅 STOMP CONNECT 전용 토큰(GET /api/chat/socket-token)

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY}
  bucket: ${SUPABASE_BUCKET}

# GMS(SSAFY) AI 번역 (KAN-267). 키 미설정/만료 또는 enabled=false면 자동 번역 비활성 → ko fallback.
# base-url/model은 SSAFY GMS(OpenAI 호환 프록시) 기본값이며, 콘솔 확정값과 다르면 .env로 override 한다.
gms:
  base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  key: ${GMS_KEY:}
  model: ${GMS_MODEL:gpt-4o-mini}
  enabled: ${GMS_ENABLED:true}
  max-input-chars: ${GMS_MAX_INPUT_CHARS:2000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

notification:
  email:
    from: ${MAIL_FROM}

server:
  port: 8080

app:
  frontend-url: ${FRONTEND_URL:https://www.whatsup.house}

# 우연한 식탁
# - system-admin-id: 자동 확정 채팅방 개설자(관리자 회원 UUID). 비우면 활성 관리자 중 한 명이 개설자가 된다. (KAN-346)
# - resolution-respond-hours: 매칭 실패 해결 선택(대체 회차·이용권 보관·환불) 응답 기한(시간). 지나면 이용권 보관으로 자동 처리 (KAN-347)
dining:
  system-admin-id: ${DINING_SYSTEM_ADMIN_ID:}
  resolution-respond-hours: 48

# 채팅 본문 AES-256-GCM 키(base64 32바이트). 운영 필수 — 없으면 기동 실패가 의도된 동작.
# 생성: openssl rand -base64 32 / 키를 바꾸면 기존 메시지는 복호화되지 않는다(키 로테이션 미지원).
chat:
  encryption-key: ${CHAT_ENCRYPTION_KEY}
  # 웹 푸시 VAPID(KAN-335). 셋 중 하나라도 비면 웹 푸시 비활성(구독 API 503, 발송 스킵) — local은 미설정이 기본.
  # 생성: npx web-push generate-vapid-keys (base64url) / subject: mailto:운영메일 또는 https URL
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:}
